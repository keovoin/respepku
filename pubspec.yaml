name: sastra_fitmeal
description: Sastra Fitmeal — Khmer & world recipes. Find, cook & track your favorite meals.
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ^3.5.0

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  provider: ^6.1.2
  shared_preferences: ^2.2.3
  http: ^1.2.0
  qr_flutter: ^4.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  assets:
    # Bundled offline recipe photos — the app needs no network at all.
    - assets/food/
  fonts:
    # Proper Khmer rendering (stacked subscripts need real metrics).
    - family: NotoSansKhmer
      fonts:
        - asset: assets/fonts/NotoSansKhmer-400.ttf
          weight: 400
        - asset: assets/fonts/NotoSansKhmer-500.ttf
          weight: 500
        - asset: assets/fonts/NotoSansKhmer-600.ttf
          weight: 600
        - asset: assets/fonts/NotoSansKhmer-700.ttf
          weight: 700
        - asset: assets/fonts/NotoSansKhmer-800.ttf
          weight: 800
