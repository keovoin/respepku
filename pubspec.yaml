name: sastra_fitmeal
description: Sastra Fitmeal — Khmer & world recipes. Find, cook & track your favorite meals.
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ^3.5.0

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  provider: ^6.1.2
  shared_preferences: ^2.2.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  assets:
    # Bundled offline recipe photos — the app needs no network at all.
    - assets/food/
