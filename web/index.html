<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="A new Flutter project.">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="Sastra Fitmeal">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>Sastra Fitmeal</title>
  <link rel="manifest" href="manifest.json">
  <!-- Telegram Mini App SDK: expand to full screen inside Telegram -->
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <script>
    (function () {
      try {
        var tg = window.Telegram && window.Telegram.WebApp;
        if (tg && tg.initData) {
          tg.expand();
          tg.setHeaderColor("#FBF8F5");
          tg.setBackgroundColor("#FBF8F5");
          tg.ready();
          // pass Telegram language to the app via localStorage default
          try {
            if (!localStorage.getItem("lang") &&
                (tg.startParam || location.search.indexOf("startapp") >= 0)) {
              localStorage.setItem("lang",
                (tg.languageCode || "km").indexOf("km") === 0 ? "kh" : "en");
            }
            if (tg.initDataUnsafe && tg.initDataUnsafe.user) {
              localStorage.setItem("tg_name",
                tg.initDataUnsafe.user.first_name || "");
            }
          } catch (e) {}
        }
      } catch (e) {}
    })();
  </script>
</head>
<body>
  <!--
    You can customize the "flutter_bootstrap.js" script.
    This is useful to provide a custom configuration to the Flutter loader
    or to give the user feedback during the initialization process.

    For more details:
    * https://docs.flutter.dev/platform-integration/web/initialization
  -->
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
