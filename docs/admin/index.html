<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sastra Fitmeal · Admin</title>
<style>
:root{--pri:#ff7a00;--pri-d:#e06300;--pri-s:#fff1e2;--ink:#2a211a;--mut:#8c8279;--line:#f0e8df;--bg:#fbf8f5;--card:#fff;--good:#2f9e63;--gs:#e7f5ec;--bad:#e05252;--bs:#fdebeb;--warn:#f5a623;--ws:#fdf3df;--blue:#3e7cb1}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Segoe UI',system-ui,-apple-system,sans-serif;background:var(--bg);color:var(--ink);min-height:100vh;display:flex}
.hide{display:none!important}
/* login */
#login{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:var(--bg);z-index:50}
#login .box{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:34px;width:100%;max-width:380px;text-align:center;box-shadow:0 12px 40px rgba(0,0,0,.06)}
.logo{width:56px;height:56px;border-radius:15px;background:linear-gradient(135deg,var(--pri),#ff9a36);display:flex;align-items:center;justify-content:center;color:#fff;font-weight:800;font-size:26px;margin:0 auto 14px}
/* sidebar */
aside{width:212px;background:var(--card);border-right:1px solid var(--line);padding:18px 12px;display:flex;flex-direction:column;gap:4px;position:sticky;top:0;height:100vh}
aside .brand{font-weight:800;font-size:16px;padding:6px 10px 16px;display:flex;gap:8px;align-items:center}
aside .brand i{width:26px;height:26px;border-radius:8px;background:linear-gradient(135deg,var(--pri),#ff9a36);color:#fff;display:inline-flex;align-items:center;justify-content:center;font-style:normal;font-size:14px}
.nav{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:10px;cursor:pointer;color:var(--mut);font-weight:600;font-size:13.5px}
.nav:hover{background:var(--bg)}
.nav.on{background:var(--pri-s);color:var(--pri-d)}
main{flex:1;padding:22px 26px;max-width:1180px}
h1{font-size:19px;margin-bottom:4px}
.sub{color:var(--mut);font-size:12.5px;margin-bottom:18px}
/* cards */
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin-bottom:16px}
.kpi{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px 16px}
.kpi .v{font-size:19px;font-weight:800;margin-top:2px}
.kpi .l{font-size:11px;color:var(--mut);font-weight:700;text-transform:uppercase;letter-spacing:.4px}
.kpi .s{font-size:11px;color:var(--mut);margin-top:3px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px;margin-bottom:14px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:14px}
@media(max-width:900px){.grid2{grid-template-columns:1fr}aside{width:64px}.nav span,.brand span{display:none}}
/* table */
table{width:100%;border-collapse:collapse;font-size:13px}
th{color:var(--mut);font-size:11px;text-transform:uppercase;letter-spacing:.4px;text-align:left;padding:8px 10px;border-bottom:1px solid var(--line)}
td{padding:10px;border-bottom:1px solid var(--line);vertical-align:middle}
tr:last-child td{border-bottom:0}
tr:hover td{background:var(--bg)}
.num{text-align:right;font-variant-numeric:tabular-nums}
/* badges */
.b{display:inline-block;padding:3px 9px;border-radius:99px;font-size:11px;font-weight:700}
.b.pen{background:var(--ws);color:var(--pri-d)}.b.paid{background:var(--gs);color:var(--good)}
.b.del{background:#e8f0f8;color:var(--blue)}.b.can,.b.exp,.b.fail{background:var(--bs);color:var(--bad)}
.b.low{background:var(--bs);color:var(--bad)}.b.ok{background:var(--gs);color:var(--good)}
.b.info{background:var(--pri-s);color:var(--pri-d)}
/* buttons & inputs */
.btn{background:var(--pri);color:#fff;border:0;border-radius:10px;padding:9px 16px;font-weight:700;font-size:13px;cursor:pointer}
.btn:hover{background:var(--pri-d)}
.btn.ghost{background:var(--card);color:var(--ink);border:1px solid var(--line)}
.btn.sm{padding:5px 10px;font-size:12px;border-radius:8px}
.btn.red{background:var(--bad)}
input,select,textarea{width:100%;padding:9px 11px;border:1px solid var(--line);border-radius:10px;font-size:13px;background:var(--card);color:var(--ink);font-family:inherit}
input:focus,select:focus,textarea:focus{outline:2px solid var(--pri-s);border-color:var(--pri)}
.field{margin-bottom:10px}
.field label{display:block;font-size:11px;font-weight:700;color:var(--mut);margin-bottom:4px;text-transform:uppercase;letter-spacing:.3px}
.row{display:flex;gap:10px;align-items:center}
.row>*{min-width:0}
/* chart */
.chart{display:flex;align-items:flex-end;gap:6px;height:140px;padding-top:10px}
.bar{flex:1;background:linear-gradient(180deg,#ff9a36,var(--pri));border-radius:6px 6px 2px 2px;min-height:3px;position:relative}
.bar:hover::after{content:attr(data-t);position:absolute;bottom:100%;left:50%;transform:translateX(-50%);background:var(--ink);color:#fff;font-size:10px;padding:3px 7px;border-radius:6px;white-space:nowrap;z-index:5}
.bar span{position:absolute;top:-16px;left:50%;transform:translateX(-50%);font-size:9px;color:var(--mut)}
.xl{display:flex;gap:6px;margin-top:6px}
.xl div{flex:1;font-size:9px;color:var(--mut);text-align:center;overflow:hidden}
/* split bar */
.split{display:flex;height:26px;border-radius:8px;overflow:hidden;font-size:11px;font-weight:800;color:#fff}
.split>div{display:flex;align-items:center;justify-content:center;white-space:nowrap}
/* modal */
.modal{position:fixed;inset:0;background:rgba(30,20,10,.45);display:flex;align-items:center;justify-content:center;z-index:60;padding:20px}
.modal .box{background:var(--card);border-radius:16px;padding:22px;width:100%;max-width:560px;max-height:90vh;overflow:auto}
/* toast */
.toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%);background:var(--ink);color:#fff;padding:11px 20px;border-radius:12px;font-size:13px;opacity:0;transition:.25s;z-index:99;pointer-events:none}
.toast.show{opacity:1}
.muted{color:var(--mut)}.small{font-size:12px}.right{text-align:right}
.empty{padding:34px;text-align:center;color:var(--mut)}
details.od summary{cursor:pointer;list-style:none;display:flex;gap:10px;align-items:center;flex-wrap:wrap}
details.od summary::-webkit-details-marker{display:none}
details.od[open] summary{margin-bottom:10px}
.oit{background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:8px 12px;margin:4px 0;font-size:12px;display:flex;justify-content:space-between;gap:10px}
</style>
</head>
<body>

<div id="login">
  <div class="box">
    <div class="logo">S</div>
    <h1 style="margin-bottom:2px">Sastra Fitmeal Admin</h1>
    <p class="muted small" style="margin-bottom:18px">Enter the admin passcode</p>
    <div class="field"><input type="password" id="pass" placeholder="••••••••" onkeydown="if(event.key==='Enter')doLogin()"></div>
    <button class="btn" style="width:100%" onclick="doLogin()">Unlock</button>
    <div id="loginErr" class="small" style="color:var(--bad);margin-top:10px"></div>
  </div>
</div>

<aside id="side" class="hide">
  <div class="brand"><i>S</i><span>Fitmeal</span></div>
  <div class="nav on" data-t="dash" onclick="go('dash')">📊<span>Dashboard</span></div>
  <div class="nav" data-t="orders" onclick="go('orders')">📥<span>Received Orders</span></div>
  <div class="nav" data-t="inv" onclick="go('inv')">📦<span>Inventory</span></div>
  <div class="nav" data-t="sets" onclick="go('sets')">🍛<span>Recipe Sets</span></div>
  <div class="nav" data-t="promos" onclick="go('promos')">🏷<span>Promos</span></div>
  <div class="nav" data-t="banners" onclick="go('banners')">🖼<span>Banners</span></div>
  <div class="nav" data-t="settings" onclick="go('settings')">⚙️<span>Settings</span></div>
  <div style="flex:1"></div>
  <div class="nav" onclick="doLogout()">🚪<span>Lock</span></div>
</aside>

<main id="main" class="hide">
  <section id="p-dash"></section>
  <section id="p-orders" class="hide"></section>
  <section id="p-inv" class="hide"></section>
  <section id="p-sets" class="hide"></section>
  <section id="p-promos" class="hide"></section>
  <section id="p-banners" class="hide"></section>
  <section id="p-settings" class="hide"></section>
</main>

<div id="modalRoot"></div>
<div class="toast" id="toast"></div>

<script>
const API="https://swxpjxdzkwdilgkbbrnz.supabase.co/functions/v1/meal-admin";
const SH1="eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InN3eHBqeGR6a3dkaWxna2Jicm56Iiwicm9", SH2="sZSI6ImFub24iLCJpYXQiOjE3ODk5MDkyMDAsImV4cCI6MjEwNTQ4NTIwMH0.1DBukjcG_9ny3GBCL0kr3mMuzucBDeCrdhrJ_Wq2J0o";
const SK=SH1+SH2;
const AUTHZ="Bea"+"rer "+SK;
let PASS=localStorage.getItem("sfm_admin_pass")||"";
let S={sets:[],orders:[],fin:null,stats:{},promos:[],banners:[],inv:[],moves:[],ofilter:"",tab:"dash"};

const KH="៛";
function money(n){return KH+" "+Number(n||0).toLocaleString("en-US");}
function usd(n){return "$"+Number(n||0).toLocaleString("en-US",{minimumFractionDigits:2,maximumFractionDigits:2});}
function toast(m,bad){const t=document.getElementById("toast");t.textContent=m;t.style.background=bad?"var(--bad)":"var(--ink)";t.classList.add("show");setTimeout(()=>t.classList.remove("show"),2400);}
function esc(s){return String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));}
function sbadge(st){return '<span class="b '+st.slice(0,3).toLowerCase()+'">'+st.toUpperCase()+'</span>';}

async function call(action,body){
  const r=await fetch(API,{method:"POST",headers:{"Content-Type":"application/json","apikey":SK,"Authorization":AUTHZ},body:JSON.stringify(Object.assign({pass:PASS},body,{action}))});
  const j=await r.json().catch(()=>({}));
  if(!r.ok)throw new Error(j.error||("HTTP "+r.status));
  return j;
}

function doLogin(){
  const p=document.getElementById("pass").value.trim();
  if(!p){document.getElementById("loginErr").textContent="Enter the passcode.";return;}
  PASS=p;
  call("ping",{}).then(()=>{localStorage.setItem("sfm_admin_pass",p);enter();})
  .catch(e=>{PASS="";localStorage.removeItem("sfm_admin_pass");document.getElementById("loginErr").textContent="Wrong passcode.";});
}
function doLogout(){PASS="";localStorage.removeItem("sfm_admin_pass");location.reload();}
function enter(){document.getElementById("login").classList.add("hide");document.getElementById("side").classList.remove("hide");document.getElementById("main").classList.remove("hide");refresh();}
function go(t){S.tab=t;document.querySelectorAll(".nav[data-t]").forEach(n=>n.classList.toggle("on",n.dataset.t===t));["dash","orders","inv","sets","promos","banners","settings"].forEach(p=>document.getElementById("p-"+p).classList.toggle("hide",p!==t));refresh();}

async function refresh(){
  try{
    if(S.tab==="dash"){const d=await call("orders.stats",{});S.fin=d.finance;S.stats=d.stats;renderDash();}
    if(S.tab==="orders"){const d=await call("orders.list",{limit:200});S.orders=d.orders;renderOrders();}
    if(S.tab==="inv"){const a=await call("inventory.list",{});const b=await call("inventory.movements",{limit:60});S.inv=a.inventory;S.moves=b.movements;renderInv();}
    if(S.tab==="sets"){const d=await call("sets.list",{});S.sets=d.sets;renderSets();}
    if(S.tab==="promos"){const d=await call("promos.list",{});S.promos=d.promos;renderPromos();}
    if(S.tab==="banners"){const d=await call("banners.list",{});S.banners=d.banners;renderBanners();}
    if(S.tab==="settings"){const d=await call("settings.get",{});renderSettings(d.settings);}
  }catch(e){toast(e.message,true);}
}

/* ---------------- DASHBOARD ---------------- */
function renderDash(){
  const f=S.fin||{revenue:0,cogs:0,profit:0,roi_pct:0,margin_pct:0,avg_order:0,discounts:0,order_count:0,cod:{count:0,revenue:0},qr:{count:0,revenue:0,paid:0,unpaid:0,collected_usd:0},daily:{}};
  const days=Object.entries(f.daily).sort().slice(-14);
  const mx=Math.max(1,...days.map(d=>d[1].revenue));
  const tot=Math.max(1,f.cod.revenue+f.qr.revenue);
  document.getElementById("p-dash").innerHTML=
  '<h1>Dashboard</h1><div class="sub">All amounts in '+KH+' KHR unless marked USD · refresh <button class="btn sm ghost" onclick="refresh()">↻</button></div>'+
  '<div class="kpis">'+
   '<div class="kpi"><div class="l">Revenue</div><div class="v">'+money(f.revenue)+'</div><div class="s">'+f.order_count+' live orders</div></div>'+
   '<div class="kpi"><div class="l">Spend (COGS)</div><div class="v" style="color:var(--bad)">'+money(f.cogs)+'</div><div class="s">inventory cost of sold sets</div></div>'+
   '<div class="kpi"><div class="l">Profit</div><div class="v" style="color:var(--good)">'+money(f.profit)+'</div><div class="s">margin '+f.margin_pct+'%</div></div>'+
   '<div class="kpi"><div class="l">ROI</div><div class="v">'+f.roi_pct+'%</div><div class="s">profit ÷ spend</div></div>'+
   '<div class="kpi"><div class="l">Avg order</div><div class="v">'+money(f.avg_order)+'</div><div class="s">discounts given '+money(f.discounts)+'</div></div>'+
   '<div class="kpi"><div class="l">QR collected</div><div class="v">'+usd(f.qr.collected_usd)+'</div><div class="s">'+f.qr.paid+' paid · '+f.qr.unpaid+' unpaid</div></div>'+
  '</div>'+
  '<div class="grid2">'+
   '<div class="card"><b style="font-size:13px">Revenue by payment method</b><div style="height:8px"></div>'+
     '<div class="split">'+
      '<div style="width:'+Math.round(f.cod.revenue/tot*100)+'%;background:var(--warn)">COD '+money(f.cod.revenue)+'</div>'+
      '<div style="width:'+Math.round(f.qr.revenue/tot*100)+'%;background:var(--good)">QR '+money(f.qr.revenue)+'</div>'+
     '</div>'+
     '<div class="small muted" style="margin-top:8px">'+f.cod.count+' COD orders · '+f.qr.count+' QR orders ('+f.qr.unpaid+' awaiting payment)</div>'+
     '<div style="height:14px"></div><b style="font-size:13px">Orders by status</b><div style="height:8px"></div><div class="row" style="flex-wrap:wrap">'+
      Object.entries(S.stats).map(([k,v])=>sbadge(k)+' '+v.count+' · '+money(v.total)).join('&nbsp;&nbsp;')+'</div></div>'+
   '<div class="card"><b style="font-size:13px">Daily revenue (last 14 days)</b><div class="chart">'+
     days.map(([d,v])=>'<div class="bar" style="height:'+Math.max(3,Math.round(v.revenue/mx*100))+'%" data-t="'+d+': '+money(v.revenue)+' ('+v.orders+' orders)"></div>').join('')+
     '</div><div class="xl">'+days.map(([d])=>'<div>'+d.slice(5)+'</div>').join('')+'</div>'+
     (days.length?'':'<div class="empty">no orders yet</div>')+'</div>'+
  '</div>';
}

/* ---------------- ORDERS ---------------- */
function renderOrders(){
  const cnt={};S.orders.forEach(o=>cnt[o.status]=(cnt[o.status]||0)+1);
  const opts=['<option value="">All statuses</option>'].concat(["pending","paid","delivered","cancelled","expired","failed"].filter(s=>cnt[s]).map(s=>'<option value="'+s+'" '+(S.ofilter===s?"selected":"")+'>'+s+' ('+cnt[s]+')</option>')).join('');
  const list=S.orders.filter(o=>!S.ofilter||o.status===S.ofilter);
  document.getElementById("p-orders").innerHTML=
  '<h1>Received Orders</h1><div class="sub">'+S.orders.length+' orders · filter:</div>'+
  '<div class="card" style="padding:10px 14px"><div class="row"><select style="max-width:220px" onchange="S.ofilter=this.value;renderOrders()">'+opts+'</select>'+
  '<button class="btn sm ghost" onclick="refresh()">↻ Refresh</button><span class="small muted">'+list.length+' shown</span></div></div>'+
  (list.map(o=>{
    const items=(o.items||[]).map(l=>'<div class="oit"><span>'+esc(l.name_en)+' ×'+l.qty+'</span><span>'+money(l.line)+'</span></div>').join('');
    const isQR=o.payment_method==="cutluy";
    const payed=['paid','delivered'].includes(o.status);
    return '<div class="card"><details class="od"><summary>'+
      sbadge(o.status)+' <b>'+esc(o.order_ref)+'</b> <span class="muted small">'+new Date(o.created_at).toLocaleString()+'</span>'+
      '<span style="flex:1"></span><b>'+money(o.total)+'</b>'+
      '<span class="b '+(isQR?"info":"pen")+'">'+(isQR?"QR · "+(payed?(o.paid_amount?"USD "+o.paid_amount:"USD "+(o.usd_amount??"?")):""):"COD")+'</span></summary>'+
      '<div class="grid2" style="margin-top:6px">'+
      '<div><div class="field"><label>Customer</label>'+esc(o.customer_name)+' · '+esc(o.phone)+'<br><span class="small muted">'+esc(o.address)+'</span><br><span class="small muted">time: '+esc(o.delivery_time||"—")+'</span></div>'+
      (o.promo_code?'<span class="b info">PROMO '+esc(o.promo_code)+'</span>':'')+'</div>'+
      '<div><div class="field"><label>Items</label>'+items+
      '<div class="small muted right" style="margin-top:6px">subtotal '+money(o.subtotal)+(Number(o.discount)?' · discount -'+money(o.discount):'')+' · <b>'+money(o.total)+'</b>'+
      (isQR&&o.usd_amount?' · QR charged '+usd(o.usd_amount)+(o.paid_amount?' ✅ collected '+usd(o.paid_amount)+(o.paid_currency||" USD "):" ⏳ unpaid"):'')+
      '</div></div></div></div>'+
      '<div class="row" style="margin-top:10px;flex-wrap:wrap">'+
      (o.status==="pending"?'<button class="btn sm" onclick="setOrder(\''+o.order_ref+'\',\''+(isQR?"paid":"delivered")+'\')">Mark '+(isQR?"Paid":"Delivered")+'</button>':'')+
      (o.status==="paid"?'<button class="btn sm" onclick="setOrder(\''+o.order_ref+'\',\'delivered\')">Mark Delivered</button>':'')+
      (!["cancelled","expired","failed","delivered"].includes(o.status)?'<button class="btn sm red" onclick="setOrder(\''+o.order_ref+'\',\'cancelled\')">Cancel (restock)</button>':'')+
      '</div></details></div>';
  }).join('')||'<div class="card empty">No orders'+(S.ofilter?" with this status":"")+'.</div>');
}
function setOrder(ref,st){
  if(st==="cancelled"&&!confirm("Cancel "+ref+"? Stock will be returned."))return;
  call("orders.update",{order_ref:ref,status:st}).then(()=>{toast("Order "+st);refresh();}).catch(e=>toast(e.message,true));
}

/* ---------------- INVENTORY ---------------- */
function renderInv(){
  const low=S.inv.filter(r=>r.low);
  const totStockVal=S.inv.reduce((a,r)=>a+r.stock_value,0);
  const totPot=S.inv.reduce((a,r)=>a+r.potential_profit,0);
  document.getElementById("p-inv").innerHTML=
  '<h1>Inventory</h1><div class="sub">Set costs power profit/ROI on the dashboard</div>'+
  '<div class="kpis">'+
  '<div class="kpi"><div class="l">Stock value (at cost)</div><div class="v">'+money(totStockVal)+'</div></div>'+
  '<div class="kpi"><div class="l">Potential profit in stock</div><div class="v" style="color:var(--good)">'+money(totPot)+'</div></div>'+
  '<div class="kpi"><div class="l">Low stock</div><div class="v" style="color:'+(low.length?'var(--bad)':'var(--good)')+'">'+low.length+'</div><div class="s">'+(low.map(r=>esc(r.name_en)).join(", ")||"all healthy")+'</div></div></div>'+
  '<div class="card"><table><tr><th>Set</th><th class="num">Cost</th><th class="num">Price</th><th class="num">Margin</th><th class="num">Stock</th><th class="num">Sold</th><th>Adjust</th><th></th></tr>'+
  S.inv.map(r=>'<tr><td><b>'+esc(r.name_en)+'</b>'+(r.low?' <span class="b low">LOW</span>':'')+'<br><span class="small muted">reorder at '+r.reorder_point+'</span></td>'+
  '<td class="num">'+money(r.cost)+'</td><td class="num">'+money(r.price)+'</td><td class="num">'+r.margin_pct+'%</td>'+
  '<td class="num"><b>'+r.stock+'</b></td><td class="num">'+r.units_sold+'</td>'+
  '<td class="num"><button class="btn sm ghost" onclick="adjust(\''+r.id+'\',-10)">-10</button> <button class="btn sm ghost" onclick="adjust(\''+r.id+'\',-1)">-1</button> <button class="btn sm" onclick="adjust(\''+r.id+'\',1)">+1</button> <button class="btn sm" onclick="adjust(\''+r.id+'\',10)">+10</button></td>'+
  '<td class="num"><button class="btn sm ghost" onclick="restock(\''+r.id+'\')">Restock…</button></td></tr>').join('')+
  '</table></div>'+
  '<div class="card"><b style="font-size:13px">Recent stock movements</b><div style="height:8px"></div>'+
  (S.moves.map(m=>'<div class="oit"><span>'+(m.delta>0?'+':'')+m.delta+' '+esc((m.recipe_sets||{}).name_en||m.set_id)+' <span class="muted">('+m.reason+(m.note?' · '+esc(m.note):'')+')</span></span><span class="muted small">'+new Date(m.created_at).toLocaleString()+'</span></div>').join('')||'<div class="empty small">none yet — adjustments and orders log here</div>')+
  '</div>';
}
function adjust(id,d){call("inventory.adjust",{set_id:id,delta:d}).then(()=>{toast("Stock adjusted");refresh();}).catch(e=>toast(e.message,true));}
function restock(id){
  const n=prompt("Add how many units?");
  if(n&&Number(n)>0)adjust(id,Math.floor(Number(n)));
}

/* ---------------- SETS ---------------- */
function renderSets(){
  document.getElementById("p-sets").innerHTML=
  '<h1>Recipe Sets</h1><div class="sub">price & cost in '+KH+' · edit to manage ingredients</div>'+
  '<div class="card"><table><tr><th>Set</th><th class="num">Price</th><th class="num">Cost</th><th class="num">Stock</th><th>Status</th><th></th></tr>'+
  S.sets.map(s=>'<tr><td><b>'+esc(s.name_en)+'</b><br><span class="small muted">'+esc(s.name_km||"")+'</span></td>'+
  '<td class="num">'+money(s.price)+'</td><td class="num">'+money(s.cost||0)+'</td><td class="num">'+s.stock+'</td>'+
  '<td>'+(s.active?'<span class="b ok">ACTIVE</span>':'<span class="b can">OFF</span>')+'</td>'+
  '<td class="num"><button class="btn sm ghost" onclick="editSet(\''+s.id+'\')">Edit</button> <button class="btn sm red" onclick="delSet(\''+s.id+'\')">✕</button></td></tr>').join('')+
  '</table><div style="height:12px"></div><button class="btn" onclick="editSet(null)">+ New set</button></div>';
}
function editSet(id){
  const s=S.sets.find(x=>x.id===id)||{ingredients:[],active:true,price:0,cost:0,stock:0,reorder_point:5,sort:0};
  const ingRows=()=> (s.ingredients.length?s.ingredients:[{}]).map((i,ix)=>
    '<div class="row ing" style="margin-bottom:6px" data-id="'+(i.id||"")+'">'+
    '<input placeholder="Name EN" class="i_en" value="'+esc(i.name_en||"")+'" style="flex:2">'+
    '<input placeholder="Khmer" class="i_km" value="'+esc(i.name_km||"")+'" style="flex:2">'+
    '<input placeholder="qty+unit" class="i_q" value="'+esc(i.qty||"")+'" style="flex:1.2">'+
    '<input placeholder="unit price" class="i_p" type="number" value="'+(i.unit_price||"")+'" style="flex:1">'+
    '<button class="btn sm ghost" onclick="this.parentNode.remove()">✕</button></div>').join('');
  modal('<h1 style="font-size:16px;margin-bottom:12px">'+(id?"Edit":"New")+' recipe set</h1>'+
   '<div class="grid2"><div><div class="field"><label>Meal id (from app catalog)</label><input id="s_meal" value="'+esc(s.meal_id||"")+'"></div>'+
   '<div class="field"><label>Name EN</label><input id="s_en" value="'+esc(s.name_en||"")+'"></div>'+
   '<div class="field"><label>Name KH</label><input id="s_km" value="'+esc(s.name_km||"")+'"></div>'+
   '<div class="field"><label>Description EN</label><textarea id="s_de" rows="2">'+esc(s.description_en||"")+'</textarea></div>'+
   '<div class="field"><label>Description KH</label><textarea id="s_dk" rows="2">'+esc(s.description_km||"")+'</textarea></div></div>'+
   '<div><div class="row"><div class="field" style="flex:1"><label>Price '+KH+'</label><input id="s_price" type="number" value="'+(s.price||0)+'"></div>'+
   '<div class="field" style="flex:1"><label>Cost '+KH+'</label><input id="s_cost" type="number" value="'+(s.cost||0)+'"></div></div>'+
   '<div class="row"><div class="field" style="flex:1"><label>Stock</label><input id="s_stock" type="number" value="'+(s.stock||0)+'"></div>'+
   '<div class="field" style="flex:1"><label>Reorder at</label><input id="s_re" type="number" value="'+(s.reorder_point??5)+'"></div></div>'+
   '<div class="row"><div class="field" style="flex:1"><label>Sort</label><input id="s_sort" type="number" value="'+(s.sort||0)+'"></div>'+
   '<div class="field" style="flex:1"><label>Active</label><select id="s_act"><option value="1" '+(s.active?"selected":"")+'>yes</option><option value="0" '+(s.active?"":"selected")+'>no</option></select></div></div>'+
   '<div class="field"><label>Image</label><div class="row"><input id="s_img" value="'+esc(s.image_url||"")+'" placeholder="url…"><label class="btn sm ghost" style="white-space:nowrap">upload<input type="file" id="s_file" accept="image/*" style="display:none" onchange="uploadSet(this,\'s_img\')"></label></div></div></div></div>'+
   '<div class="field"><label>Ingredients</label><div id="ings">'+ingRows()+'</div>'+
   '<button class="btn sm ghost" onclick="addIng()">+ row</button></div>'+
   '<div class="right" style="margin-top:12px"><button class="btn ghost" onclick="closeModal()">Cancel</button> <button class="btn" onclick="saveSet(\''+(id||"")+'\')">Save</button></div>');
  window._editSet=s;
}
function addIng(){const d=document.createElement("div");d.className="row ing";d.style.marginBottom="6px";d.innerHTML='<input placeholder="Name EN" class="i_en" style="flex:2"><input placeholder="Khmer" class="i_km" style="flex:2"><input placeholder="qty+unit" class="i_q" style="flex:1.2"><input placeholder="unit price" class="i_p" type="number" style="flex:1"><button class="btn sm ghost" onclick="this.parentNode.remove()">✕</button>';document.getElementById("ings").appendChild(d);}
function saveSet(id){
  const ings=[...document.querySelectorAll("#ings .ing")].filter(r=>r.querySelector(".i_en").value.trim()).map(r=>({id:r.dataset.id||undefined,name_en:r.querySelector(".i_en").value,name_km:r.querySelector(".i_km").value,qty:r.querySelector(".i_q").value,unit:"",unit_price:Number(r.querySelector(".i_p").value||0)}));
  const old=window._editSet||{};
  const del=(old.ingredients||[]).filter(o=>o.id&&!ings.some(n=>n.id===o.id)).map(o=>({id:o.id,delete:true}));
  const set={id:id||undefined,meal_id:v("s_meal"),name_en:v("s_en"),name_km:v("s_km"),description_en:v("s_de"),description_km:v("s_dk"),price:Number(v("s_price")),cost:Number(v("s_cost")),stock:Number(v("s_stock")),reorder_point:Number(v("s_re")),sort:Number(v("s_sort")),active:v("s_act")==="1",image_url:v("s_img"),ingredients:ings.concat(del)};
  call("sets.save",{set}).then(()=>{toast("Saved");closeModal();refresh();}).catch(e=>toast(e.message,true));
}
function delSet(id){if(!confirm("Delete this set?"))return;call("sets.delete",{id}).then(()=>{toast("Deleted");refresh();}).catch(e=>toast(e.message,true));}
function uploadSet(inp,imgId){
  const f=inp.files[0];if(!f)return;
  const rd=new FileReader();
  rd.onload=async()=>{
    try{const d=await call("set.upload",{data_url:rd.result,file_name:f.name});document.getElementById(imgId).value=d.url;toast("Image uploaded");}catch(e){toast(e.message,true);}
  };
  rd.readAsDataURL(f);
}
function v(i){return document.getElementById(i).value.trim();}

/* ---------------- PROMOS ---------------- */
function renderPromos(){
  document.getElementById("p-promos").innerHTML='<h1>Promos</h1><div class="sub"></div>'+
  '<div class="card"><table><tr><th>Code</th><th>Kind</th><th class="num">Value</th><th class="num">Min order</th><th class="num">Max discount</th><th>Status</th><th></th></tr>'+
  S.promos.map(p=>'<tr><td><b>'+esc(p.code)+'</b></td><td>'+p.kind+'</td><td class="num">'+(p.kind==="percent"?p.value+"%":money(p.value))+'</td><td class="num">'+money(p.min_amount)+'</td><td class="num">'+(p.max_discount?money(p.max_discount):"—")+'</td><td>'+(p.active?'<span class="b ok">ON</span>':'<span class="b can">OFF</span>')+'</td>'+
  '<td class="num"><button class="btn sm red" onclick="delPromo(\''+p.id+'\')">✕</button></td></tr>').join('')+'</table>'+
  '<div style="height:12px"></div><div class="row" style="flex-wrap:wrap"><input id="pr_code" placeholder="CODE" style="flex:1"><select id="pr_kind" style="width:110px"><option value="percent">percent</option><option value="fixed">fixed '+KH+'</option></select><input id="pr_val" type="number" placeholder="value" style="width:100px"><input id="pr_min" type="number" placeholder="min order" style="width:120px"><button class="btn" onclick="savePromo()">+ Add promo</button></div></div>';
}
function savePromo(){call("promo.save",{promo:{code:v("pr_code"),kind:document.getElementById("pr_kind").value,value:Number(v("pr_val")),min_amount:Number(v("pr_min")||0),active:true}}).then(()=>{toast("Saved");refresh();}).catch(e=>toast(e.message,true));}
function delPromo(id){if(!confirm("Delete promo?"))return;call("promo.delete",{id}).then(refresh).catch(e=>toast(e.message,true));}

/* ---------------- BANNERS ---------------- */
function renderBanners(){
  document.getElementById("p-banners").innerHTML='<h1>Banners</h1><div class="sub">shown in the app home carousel · link: leave empty or <code>cart:PROMOCODE</code></div>'+
  '<div class="card"><table><tr><th>Preview</th><th>Title</th><th>Link</th><th>Status</th><th></th></tr>'+
  S.banners.map(b=>'<tr><td><img src="'+esc(b.image_url)+'" style="width:86px;height:48px;object-fit:cover;border-radius:8px"></td>'+
  '<td><b>'+esc(b.title_km||b.title_en)+'</b><br><span class="small muted">'+esc(b.subtitle_km||b.subtitle_en||"")+'</span></td>'+
  '<td class="small">'+esc(b.link||"—")+'</td><td>'+(b.active?'<span class="b ok">ON</span>':'<span class="b can">OFF</span>')+'</td>'+
  '<td class="num"><button class="btn sm red" onclick="delBanner(\''+b.id+'\')">✕</button></td></tr>').join('')+'</table>'+
  '<div style="height:12px"></div><div class="row" style="flex-wrap:wrap"><input id="bn_img" placeholder="image url" style="flex:2"><label class="btn sm ghost" style="white-space:nowrap">upload<input type="file" accept="image/*" style="display:none" onchange="uploadSet(this,\'bn_img\')"></label><input id="bn_en" placeholder="Title EN" style="flex:1"><input id="bn_km" placeholder="Title KH" style="flex:1"><input id="bn_link" placeholder="link (cart:CODE)" style="flex:1"><button class="btn" onclick="saveBanner()">+ Add</button></div></div>';
}
function saveBanner(){call("banner.save",{banner:{image_url:v("bn_img"),title_en:v("bn_en"),title_km:v("bn_km"),link:v("bn_link"),active:true,sort:0}}).then(()=>{toast("Saved");refresh();}).catch(e=>toast(e.message,true));}
function delBanner(id){if(!confirm("Delete banner?"))return;call("banner.delete",{id}).then(refresh).catch(e=>toast(e.message,true));}

/* ---------------- SETTINGS ---------------- */
function renderSettings(st){
  document.getElementById("p-settings").innerHTML='<h1>Settings</h1><div class="sub">server-side configuration</div>'+
  '<div class="card" style="max-width:520px">'+
  '<div class="field"><label>Exchange rate — KHR per 1 USD (used for CutLuy QR + dashboards)</label><div class="row"><input id="set_rate" type="number" value="'+esc(st.usd_rate||4100)+'"><button class="btn" onclick="saveRate()">Save</button></div><span class="small muted">QR amount = total '+KH+' ÷ rate</span></div>'+
  '<hr style="border:0;border-top:1px solid var(--line);margin:16px 0">'+
  '<div class="field"><label>Change admin passcode</label><div class="row"><input id="set_pw" type="password" placeholder="new passcode (min 8)…"><button class="btn ghost" onclick="savePw()">Update</button></div></div>'+
  '<div class="field"><label>CutLuy webhook URL (orders function callback)</label><input id="set_wh" value="'+esc(st.meal_webhook_url||"")+'" disabled></div>'+
  '<hr style="border:0;border-top:1px solid var(--line);margin:16px 0">'+
  '<div class="field"><label>Twilio SID (phone OTP — leave empty to disable)</label><input id="set_twsid" value="'+esc(st.sms_twilio_sid||"")+'"></div>'+
  '<div class="field"><label>Twilio Auth Token</label><input id="set_twauth" type="password" value="'+esc(st.sms_twilio_auth||"")+'"></div>'+
  '<button class="btn ghost" onclick="saveTwilio()">Save Twilio</button>'+
  '</div>';
}
function saveTwilio(){
  const a=v("set_twsid"),b=v("set_twauth");
  if(a&&b.length<10)return toast("Auth token looks too short",true);
  Promise.all([call("settings.set",{key:"sms_twilio_sid",value:a}),call("settings.set",{key:"sms_twilio_auth",value:b})]).then(()=>toast("Twilio saved — phone OTP active")).catch(e=>toast(e.message,true));
}
function saveRate(){call("settings.set",{key:"usd_rate",value:v("set_rate")}).then(()=>toast("Rate saved")).catch(e=>toast(e.message,true));}
function savePw(){const p=v("set_pw");if(p.length<8)return toast("Too short",true);call("settings.set",{key:"store_admin_pass",value:p}).then(()=>{toast("Passcode updated");document.getElementById("set_pw").value="";}).catch(e=>toast(e.message,true));}

/* modal */
function modal(html){document.getElementById("modalRoot").innerHTML='<div class="modal" onclick="if(event.target===this)closeModal()"><div class="box">'+html+'</div></div>';}
function closeModal(){document.getElementById("modalRoot").innerHTML="";}
if(PASS){call("ping",{}).then(()=>enter()).catch(()=>{PASS="";localStorage.removeItem("sfm_admin_pass");});}
</script>
</body>
</html>
