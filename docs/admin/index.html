<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sastra Fitmeal · Admin Console</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Noto+Sans+Khmer:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --pri:#ff6b35; --pri-d:#ea5218; --pri-ink:#9c3506; --pri-s:#fff3ec; --pri-l:#ffd9c7;
  --ink:#0f141b; --ink-2:#39414e; --mut:#7d8697; --mut-2:#aab1bf;
  --line:#e7eaf0; --line-2:#f1f3f7;
  --bg:#f7f8fa; --card:#ffffff;
  --good:#178a50; --gs:#e4f5ec; --bad:#d93a41; --bs:#fdebec;
  --warn:#b45309; --ws:#fef3e2; --blue:#2563a8; --bs2:#e9f1fa;
  --sh:0 1px 2px rgba(15,20,27,.04),0 4px 14px rgba(15,20,27,.05);
  --sh-lg:0 12px 40px rgba(15,20,27,.14);
  --font:'Inter','Noto Sans Khmer',system-ui,-apple-system,'Segoe UI',sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{font-family:var(--font);background:var(--bg);color:var(--ink);-webkit-font-smoothing:antialiased;font-size:14px}
::selection{background:var(--pri-l)}
::-webkit-scrollbar{width:10px;height:10px}
::-webkit-scrollbar-thumb{background:#d3d8e1;border-radius:99px;border:3px solid var(--bg)}
::-webkit-scrollbar-thumb:hover{background:#bfc6d2}
.hide{display:none!important}
a{color:var(--pri-d);font-weight:600;text-decoration:none}
a:hover{text-decoration:underline}
code{background:var(--line-2);border:1px solid var(--line);padding:1.5px 7px;border-radius:6px;font-size:11.5px;color:var(--ink-2)}

/* ---------- login ---------- */
#login{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;z-index:50;padding:20px;
  background:
   radial-gradient(1000px 520px at 12% -12%, rgba(255,138,92,.16), transparent 62%),
   radial-gradient(900px 480px at 108% 112%, rgba(255,138,92,.12), transparent 60%),
   var(--bg)}
#login .box{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:40px 36px 32px;
  width:100%;max-width:396px;text-align:center;box-shadow:var(--sh-lg)}
.logo{width:56px;height:56px;border-radius:15px;background:linear-gradient(140deg,#ff8a5c,#f24d1a);
  display:flex;align-items:center;justify-content:center;margin:0 auto 18px;
  box-shadow:0 8px 20px rgba(255,107,53,.32)}
.logo svg{width:28px;height:28px}
#login h1{font-size:19px;font-weight:800;letter-spacing:-.02em}
#login .tag{color:var(--mut);font-size:12.5px;margin:6px 0 22px}
#login .cardfoot{margin-top:20px;padding-top:16px;border-top:1px solid var(--line-2);
  font-size:11px;color:var(--mut-2);display:flex;justify-content:space-between;align-items:center}

/* ---------- shell ---------- */
.shell{display:flex;min-height:100vh}
aside{width:232px;background:var(--card);border-right:1px solid var(--line);
  padding:18px 14px 16px;display:flex;flex-direction:column;gap:3px;position:sticky;top:0;height:100vh;flex:none}
.brand{display:flex;gap:11px;align-items:center;padding:8px 10px 20px}
.brand .mk{width:34px;height:34px;border-radius:10px;background:linear-gradient(140deg,#ff8a5c,#f24d1a);
  display:flex;align-items:center;justify-content:center;box-shadow:0 4px 10px rgba(255,107,53,.35);flex:none}
.brand .mk svg{width:18px;height:18px}
.brand .tx b{display:block;font-size:14px;font-weight:800;letter-spacing:-.02em}
.brand .tx span{display:block;font-size:10.5px;color:var(--mut);font-weight:600;margin-top:1px}
.nav{display:flex;align-items:center;gap:11px;padding:9.5px 12px;border-radius:10px;cursor:pointer;
  color:var(--ink-2);font-weight:600;font-size:13px;transition:background .13s,color .13s;border:0;background:none;width:100%;font-family:inherit;text-align:left}
.nav svg{width:18px;height:18px;flex:none;opacity:.72}
.nav:hover{background:var(--line-2);color:var(--ink)}
.nav.on{background:var(--pri-s);color:var(--pri-ink)}
.nav.on svg{opacity:1}
.nav.lock{margin-top:14px;border-top:1px solid var(--line);padding-top:14px;color:var(--mut)}
.nav.lock:hover{background:var(--bs);color:var(--bad)}

/* ---------- topbar + layout ---------- */
.wrap{flex:1;min-width:0;display:flex;flex-direction:column}
.topbar{background:rgba(255,255,255,.86);backdrop-filter:blur(8px);border-bottom:1px solid var(--line);
  padding:14px 28px;display:flex;align-items:center;gap:14px;position:sticky;top:0;z-index:20}
.topbar .tt{font-size:16.5px;font-weight:800;letter-spacing:-.02em}
.topbar .ts{font-size:12px;color:var(--mut);margin-top:1.5px}
.topbar .sp{flex:1}
.livedot{display:inline-flex;align-items:center;gap:7px;font-size:11.5px;font-weight:700;color:var(--good);
  background:var(--gs);border:1px solid #cdeedf;padding:5px 11px;border-radius:99px}
main{padding:24px 28px 48px;max-width:1160px;width:100%}
h1{font-size:20px;font-weight:800;letter-spacing:-.02em}
.sub{color:var(--mut);font-size:12.5px;margin:4px 0 18px;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
@media(max-width:960px){
  aside{width:64px}
  .nav span,.brand .tx{display:none}
  .brand{justify-content:center;padding-left:0;padding-right:0}
  .nav{justify-content:center;padding:11px 0}
  main{padding:18px 14px 40px}
  .topbar{padding:12px 14px}
}
@media(max-width:560px){
  body{font-size:13px}
  .topbar{padding:10px 12px;gap:10px}
  .topbar .tt{font-size:15px}
  .topbar .ts{display:none}
  .livedot{display:none}
  .topbar .btn{display:none}
  main{padding:12px 10px 80px}
  .kpis{grid-template-columns:1fr 1fr;gap:9px;margin-bottom:10px}
  .kpi{padding:12px 12px 10px;border-radius:12px}
  .kpi .v{font-size:17px}
  .card{padding:13px 13px;margin-bottom:11px;border-radius:12px}
  .chart{height:110px;gap:4px}
  .chart .bar{min-width:6px}
  /* tables → horizontal scroll */
  .card:has(>table){padding:0;overflow-x:auto;-webkit-overflow-scrolling:touch}
  .card:has(>table) table{min-width:560px}
  .card:has(>table) table th:first-child,.card:has(>table) table td:first-child{position:sticky;left:0;background:var(--card);z-index:1}
  .card:has(>table) table th:first-child{background:var(--line-2)}
  .row{flex-wrap:wrap}
  .row select{max-width:100%}
  details.od summary{padding:11px 12px;gap:8px}
  .odbody{padding:12px}
  .odbody .grid2{grid-template-columns:1fr}
  .settings-grid{grid-template-columns:1fr}
  .sub{font-size:11.5px;margin-bottom:12px}
  .split{height:26px;font-size:10px}
  .xl div{font-size:9px}
}

/* ---------- cards / kpis ---------- */
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:18px 20px;margin-bottom:14px;box-shadow:var(--sh)}
.card .ch{display:flex;align-items:center;gap:8px;margin-bottom:14px}
.card .ch b{font-size:13.5px;font-weight:700;letter-spacing:-.01em}
.card .ch .sp{flex:1}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(172px,1fr));gap:12px;margin-bottom:14px}
.kpi{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:15px 16px 13px;box-shadow:var(--sh);position:relative}
.kpi .ic{width:30px;height:30px;border-radius:9px;display:flex;align-items:center;justify-content:center;margin-bottom:10px}
.kpi .ic svg{width:16px;height:16px}
.kpi .ic.o{background:var(--pri-s);color:var(--pri-d)}
.kpi .ic.g{background:var(--gs);color:var(--good)}
.kpi .ic.b{background:var(--bs2);color:var(--blue)}
.kpi .ic.w{background:var(--ws);color:var(--warn)}
.kpi .ic.r{background:var(--bs);color:var(--bad)}
.kpi .l{font-size:10.5px;color:var(--mut);font-weight:700;text-transform:uppercase;letter-spacing:.06em}
.kpi .v{font-size:20px;font-weight:800;margin-top:3px;letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.kpi .s{font-size:11.5px;color:var(--mut);margin-top:3.5px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:14px}
@media(max-width:900px){.grid2{grid-template-columns:1fr}}

/* ---------- table ---------- */
table{width:100%;border-collapse:collapse;font-size:13px}
th{color:var(--mut);font-size:10.5px;font-weight:700;text-transform:uppercase;letter-spacing:.06em;
  text-align:left;padding:9px 10px;border-bottom:1px solid var(--line)}
td{padding:11.5px 10px;border-bottom:1px solid var(--line-2);vertical-align:middle}
tr:last-child td{border-bottom:0}
tbody tr{transition:background .1s}
tbody tr:hover{background:#fafbfc}
.num{text-align:right;font-variant-numeric:tabular-nums}

/* ---------- badges ---------- */
.b{display:inline-flex;align-items:center;gap:6px;padding:3.5px 10px;border-radius:99px;
  font-size:10.5px;font-weight:700;letter-spacing:.04em;white-space:nowrap;border:1px solid transparent}
.b::before{content:'';width:6px;height:6px;border-radius:50%;background:currentColor;flex:none}
.b.pen{background:var(--ws);color:var(--warn);border-color:#f7e3c3}
.b.paid{background:var(--gs);color:var(--good);border-color:#c8ecda}
.b.del{background:var(--bs2);color:var(--blue);border-color:#d2e2f3}
.b.can,.b.exp,.b.fail{background:var(--bs);color:var(--bad);border-color:#f6d2d3}
.b.low{background:var(--bs);color:var(--bad);border-color:#f6d2d3}
.b.ok{background:var(--gs);color:var(--good);border-color:#c8ecda}
.b.info{background:var(--pri-s);color:var(--pri-ink);border-color:var(--pri-l)}

/* ---------- buttons & inputs ---------- */
.btn{background:var(--pri);color:#fff;border:0;border-radius:10px;padding:9.5px 17px;font-weight:700;
  font-size:13px;cursor:pointer;box-shadow:0 1px 2px rgba(15,20,27,.08),0 4px 12px rgba(255,107,53,.28);
  transition:background .13s,transform .1s,box-shadow .13s;font-family:inherit;display:inline-flex;align-items:center;gap:7px}
.btn svg{width:15px;height:15px}
.btn:hover{background:var(--pri-d);transform:translateY(-1px)}
.btn:active{transform:translateY(0)}
.btn.ghost{background:var(--card);color:var(--ink-2);border:1px solid var(--line);box-shadow:var(--sh)}
.btn.ghost:hover{border-color:var(--pri-l);color:var(--pri-d);background:var(--pri-s)}
.btn.sm{padding:6.5px 12px;font-size:12px;border-radius:8px;box-shadow:none}
.btn.red{background:var(--bad);box-shadow:none}
.btn.red:hover{background:#bd3238}
input,select,textarea{width:100%;padding:9.5px 12px;border:1.5px solid var(--line);border-radius:10px;
  font-size:13px;background:#fbfcfd;color:var(--ink);font-family:inherit;transition:border-color .13s,box-shadow .13s,background .13s}
input:focus,select:focus,textarea:focus{outline:0;border-color:var(--pri);box-shadow:0 0 0 3px var(--pri-s);background:#fff}
input:disabled{opacity:.6;cursor:not-allowed}
.field{margin-bottom:13px}
.field label{display:block;font-size:10.5px;font-weight:700;color:var(--mut);margin-bottom:6px;
  text-transform:uppercase;letter-spacing:.05em}
.row{display:flex;gap:10px;align-items:center}
.row>*{min-width:0}

/* ---------- chart ---------- */
.chart{display:flex;align-items:flex-end;gap:6px;height:150px;padding-top:20px}
.bar{flex:1;background:linear-gradient(180deg,#ff8a5c,#ff6b35);border-radius:7px 7px 3px 3px;min-height:4px;position:relative;transition:filter .13s}
.bar:hover{filter:brightness(1.08)}
.bar:hover::after{content:attr(data-t);position:absolute;bottom:100%;left:50%;transform:translateX(-50%);margin-bottom:6px;
  background:var(--ink);color:#fff;font-size:10.5px;font-weight:600;padding:5px 9px;border-radius:7px;
  white-space:nowrap;z-index:5;box-shadow:var(--sh-lg)}
.xl{display:flex;gap:6px;margin-top:8px}
.xl div{flex:1;font-size:9.5px;color:var(--mut-2);text-align:center;overflow:hidden;font-weight:600}

/* ---------- split bar ---------- */
.split{display:flex;height:32px;border-radius:9px;overflow:hidden;font-size:11.5px;font-weight:700;color:#fff}
.split>div{display:flex;align-items:center;justify-content:center;white-space:nowrap;min-width:2px}

/* ---------- modal ---------- */
.modal{position:fixed;inset:0;background:rgba(15,20,27,.45);backdrop-filter:blur(4px);
  display:flex;align-items:center;justify-content:center;z-index:60;padding:20px}
.modal .box{background:var(--card);border-radius:16px;padding:24px;width:100%;max-width:620px;
  max-height:88vh;overflow:auto;box-shadow:var(--sh-lg);animation:mup .16s ease-out}
@keyframes mup{from{transform:translateY(8px) scale(.99);opacity:.5}to{transform:none;opacity:1}}

/* ---------- toast ---------- */
.toast{position:fixed;bottom:24px;right:24px;transform:translateY(14px);background:var(--ink);color:#fff;
  padding:12px 20px;border-radius:11px;font-size:13px;font-weight:600;opacity:0;transition:.25s;
  z-index:99;pointer-events:none;box-shadow:var(--sh-lg)}
.toast.show{opacity:1;transform:none}

/* ---------- misc ---------- */
.muted{color:var(--mut)}
.small{font-size:12px}
.right{text-align:right}
.empty{padding:36px;text-align:center;color:var(--mut)}
details.od{border:1px solid var(--line);border-radius:12px;margin-bottom:10px;overflow:hidden;background:var(--card);transition:box-shadow .13s,border-color .13s}
details.od[open]{box-shadow:var(--sh);border-color:var(--pri-l)}
details.od summary{cursor:pointer;list-style:none;display:flex;gap:10px;align-items:center;flex-wrap:wrap;padding:13px 16px}
details.od summary::-webkit-details-marker{display:none}
details.od summary:hover{background:#fafbfc}
details.od[open] summary{border-bottom:1px solid var(--line-2)}
.odbody{padding:14px 16px;background:#fcfcfd}
.oit{background:var(--line-2);border-radius:9px;padding:8px 13px;margin:5px 0;font-size:12.5px;display:flex;justify-content:space-between;gap:10px}
hr{border:0;border-top:1px solid var(--line);margin:18px 0}
.settings-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(340px,1fr));gap:14px}
.sect{border-top:1px solid var(--line-2);margin-top:18px;padding-top:16px}
.sect:first-of-type{border-top:0;margin-top:0;padding-top:0}
.sect .st{display:flex;align-items:center;gap:8px;margin-bottom:12px}
.sect .st b{font-size:13px;font-weight:700}
.hint{font-size:11.5px;color:var(--mut);margin-top:6px;line-height:1.5}
</style>
</head>
<body>

<!-- ============ LOGIN ============ -->
<div id="login">
  <div class="box">
    <div class="logo"><svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 11h18M5 11V7a2 2 0 0 1 2-2h10a2 2 0 0 1 2 2v4M4 11l1.2 8.2A2 2 0 0 0 7.2 21h9.6a2 2 0 0 0 2-1.8L20 11M9 15c.5 1 1.5 1.6 3 1.6s2.5-.6 3-1.6"/></svg></div>
    <h1>Sastra Fitmeal</h1>
    <div class="tag">Admin Console — enter the passcode to continue</div>
    <div class="field" style="text-align:left"><input type="password" id="pass" placeholder="Admin passcode" onkeydown="if(event.key==='Enter')doLogin()" autocomplete="current-password"></div>
    <button class="btn" style="width:100%;justify-content:center" onclick="doLogin()">Unlock console</button>
    <div id="loginErr" class="small" style="color:var(--bad);margin-top:12px;min-height:16px"></div>
    <div class="cardfoot"><span>fitmeal.sastrakh.com</span><span>v3</span></div>
  </div>
</div>

<!-- ============ SHELL ============ -->
<div class="shell hide" id="shell">
<aside>
  <div class="brand">
    <div class="mk"><svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 11h18M5 11V7a2 2 0 0 1 2-2h10a2 2 0 0 1 2 2v4M4 11l1.2 8.2A2 2 0 0 0 7.2 21h9.6a2 2 0 0 0 2-1.8L20 11"/></svg></div>
    <div class="tx"><b>Fitmeal</b><span>Admin Console</span></div>
  </div>
  <button class="nav on" data-t="dash" onclick="go('dash')"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><rect x="3" y="3" width="7" height="9" rx="1.5"/><rect x="14" y="3" width="7" height="5" rx="1.5"/><rect x="14" y="12" width="7" height="9" rx="1.5"/><rect x="3" y="16" width="7" height="5" rx="1.5"/></svg><span>Dashboard</span></button>
  <button class="nav" data-t="orders" onclick="go('orders')"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 12h-6l-2 3h-4l-2-3H2"/><path d="M5.5 5h13L22 12v6a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2v-6z"/></svg><span>Orders</span></button>
  <button class="nav" data-t="customers" onclick="go('customers')"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></svg><span>Customers</span></button>
  <button class="nav" data-t="reports" onclick="go('reports')"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M3 3v18h18"/><path d="M7 15l4-5 3 3 5-7"/></svg><span>Reports</span></button>
  <button class="nav" data-t="inv" onclick="go('inv')"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 8l-9-5-9 5v8l9 5 9-5z"/><path d="M3 8l9 5 9-5M12 13v8"/></svg><span>Inventory</span></button>
  <button class="nav" data-t="sets" onclick="go('sets')"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 11h18M5 11V7a2 2 0 0 1 2-2h10a2 2 0 0 1 2 2v4M4 11l1.2 8.2A2 2 0 0 0 7.2 21h9.6a2 2 0 0 0 2-1.8L20 11"/></svg><span>Recipe Sets</span></button>
  <button class="nav" data-t="promos" onclick="go('promos')"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20.6 13.4L11 3.8A2 2 0 0 0 9.6 3H5a2 2 0 0 0-2 2v4.6c0 .5.2 1 .6 1.4l9.6 9.6a2 2 0 0 0 2.8 0l4.6-4.6a2 2 0 0 0 0-2.8z"/><circle cx="7.5" cy="7.5" r="1"/></svg><span>Promos</span></button>
  <button class="nav" data-t="banners" onclick="go('banners')"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="8.5" cy="8.5" r="1.5"/><path d="M21 15l-5-5L5 21"/></svg><span>Banners</span></button>
  <button class="nav" data-t="settings" onclick="go('settings')"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 1 1-4 0v-.09a1.65 1.65 0 0 0-1-1.51 1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 1 1 0-4h.09a1.65 1.65 0 0 0 1.51-1 1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33h.01a1.65 1.65 0 0 0 1-1.51V3a2 2 0 1 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82v.01a1.65 1.65 0 0 0 1.51 1H21a2 2 0 1 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg><span>Settings</span></button>
  <div style="flex:1"></div>
  <button class="nav lock" onclick="doLogout()"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="11" width="18" height="11" rx="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg><span>Lock console</span></button>
</aside>

<div class="wrap">
  <div class="topbar">
    <div><div class="tt" id="topTitle">Dashboard</div><div class="ts" id="topSub">Store performance overview</div></div>
    <div class="sp"></div>

}

  '</div>'+
  '<div class="grid2">'+
   '<div class="card"><div class="ch"><b>Revenue by payment method</b></div>'+
     '<div class="split">'+
      '<div style="width:'+Math.round(f.cod.revenue/tot*100)+'%;background:linear-gradient(180deg,#f59e0b,#d97706)">COD '+money(f.cod.revenue)+'</div>'+

      (o.status==="pending"?'<button class="btn sm" onclick="setOrder(\''+o.order_ref+'\',\''+(isQR?"paid":"delivered")+'\')">Mark '+(isQR?"Paid":"Delivered")+'</button>':'')+

      (!["cancelled","expired","failed","delivered"].includes(o.status)?'<button class="btn sm red" onclick="setOrder(\''+o.order_ref+'\',\'cancelled\')">Cancel (restock)</button>':'')+
      '</div></div>';
  }).join('')||'<div class="card empty">No orders'+(S.ofilter?" with this status":"")+'.</div>');
}
function setOrder(ref,st){
  if(st==="cancelled"&&!confirm("Cancel "+ref+"? Stock will be returned."))return;
  call("orders.update",{order_ref:ref,status:st}).then(()=>{toast("Order "+st);refresh();}).catch(e=>toast(e.message,true));
}

/* ---------------- REPORTS ---------------- */
const RPT_CATS=["Chicken","Seafood","Pork","Beef","Side","Vegetarian","Vegan","Dessert","Miscellaneous","Other"];
const RPT_STS=["pending","confirmed","preparing","out_for_delivery","delivered","cancelled","expired","failed"];
const rptPad=n=>String(n).padStart(2,"0");
const rptYmd=(y,m,d)=>y+"-"+rptPad(m+1)+"-"+rptPad(d);
function rptDates(){
  const now=new Date();const Y=now.getFullYear(),M=now.getMonth(),D=now.getDate();
  if(S.rptPeriod==="today")return{from:rptYmd(Y,M,D),to:rptYmd(Y,M,D)};
  if(S.rptPeriod==="week"){const mon=new Date(Y,M,D-((now.getDay()+6)%7));return{from:rptYmd(mon.getFullYear(),mon.getMonth(),mon.getDate()),to:rptYmd(Y,M,D)};}
  if(S.rptPeriod==="month")return{from:rptYmd(Y,M,1),to:rptYmd(Y,M,D)};
  const ago=new Date(Y,M-2,1);
  const f=S.rptFrom||rptYmd(ago.getFullYear(),ago.getMonth(),1),t=S.rptTo||rptYmd(Y,M,D);
  return{from:f,to:t};
}
async function loadReport(){
  const d=rptDates();
  try{
    const r=await call("orders.report",{from:d.from,to:d.to,status:S.rptStatus,category:S.rptCat});
    S.rpt=r;renderReports();
  }catch(e){toast(e.message,true);}
}
function renderReports(){
  const r=S.rpt;
  const perds=[["today","Today"],["week","This week"],["month","This month"],["custom","Custom range"]];
  const stopts=["pending","confirmed","preparing","out_for_delivery","delivered","cancelled","expired","failed"];
  const el=document.getElementById("p-reports");
  if(!r){el.innerHTML='<div class="card"><div class="row"><select onchange="S.rptPeriod=this.value;if(this.value!==\'custom\')loadReport()">'+perds.map(p=>'<option value="'+p[0]+'" '+(S.rptPeriod===p[0]?"selected":"")+">"+p[1]+'</option>').join('')+'</select><span class="muted small" id="rptSpin">loading…</span></div></div>';return;}
  const t=r.totals;
  const catopts=["<option value=''>All categories</option>"].concat(RPT_CATS.map(c=>'<option value="'+c+'" '+(S.rptCat===c?"selected":"")+">"+c+"</option>"));
  const stopts2=["<option value=''>All statuses</option>"].concat(stopts.map(s=>'<option value="'+s+'" '+(S.rptStatus===s?"selected":"")+">"+s+"</option>"));
  const days={};
  for(const o of r.orders||[]){const d=new Date(o.created_at).toLocaleDateString("en-CA");(days[d]||={revenue:0,orders:0});days[d].revenue+=Number(o.total||0);days[d].orders+=1;}
  const dayArr=Object.entries(days).sort((a,b)=>a[0]<b[0]?-1:1).slice(-31);
  const mx=Math.max(1,...dayArr.map(d=>d[1].revenue));
  const catRows=Object.entries(r.by_category||{}).sort((a,b)=>b[1].revenue-a[1].revenue);
  const stRows=Object.entries(r.by_status||{}).sort((a,b)=>b[1].orders-a[1].orders);
  el.innerHTML=
  '<div class="card" style="padding:12px 16px"><div class="row" style="flex-wrap:wrap;gap:8px">'+
   '<select onchange="S.rptPeriod=this.value;if(this.value!==\'custom\')loadReport();else renderReports();">'+perds.map(p=>'<option value="'+p[0]+'" '+(S.rptPeriod===p[0]?"selected":"")+">"+p[1]+'</option>').join('')+'</select>'+
   (S.rptPeriod==="custom"
     ?'<input type="date" value="'+(S.rptFrom||"")+'" onchange="S.rptFrom=this.value;loadReport()" style="max-width:160px">—<input type="date" value="'+(S.rptTo||"")+'" onchange="S.rptTo=this.value;loadReport()" style="max-width:160px">'
     :'<span class="small muted">'+new Date(r.range.from).toLocaleDateString()+' → '+new Date(r.range.to).toLocaleDateString()+'</span>')+
   '<select onchange="S.rptStatus=this.value;loadReport()">'+stopts2+'</select>'+
   '<select onchange="S.rptCat=this.value;loadReport()">'+catopts+'</select>'+

function addIng(){const d=document.createElement("div");d.className="row ing";d.style.marginBottom="6px";d.innerHTML='<input placeholder="Name EN" class="i_en" style="flex:2"><input placeholder="Khmer" class="i_km" style="flex:2"><input placeholder="qty+unit" class="i_q" style="flex:1.2"><input placeholder="unit price" class="i_p" type="number" style="flex:1"><button class="btn sm ghost" onclick="this.parentNode.remove()">&#10005;</button>';document.getElementById("ings").appendChild(d);}
function saveSet(id){
  const ings=[...document.querySelectorAll("#ings .ing")].filter(r=>r.querySelector(".i_en").value.trim()).map(r=>({id:r.dataset.id||undefined,name_en:r.querySelector(".i_en").value,name_km:r.querySelector(".i_km").value,qty:r.querySelector(".i_q").value,unit:"",unit_price:Number(r.querySelector(".i_p").value||0)}));
  const old=window._editSet||{};
  const del=(old.ingredients||[]).filter(o=>o.id&&!ings.some(n=>n.id===o.id)).map(o=>({id:o.id,delete:true}));
  const set={id:id||undefined,meal_id:v("s_meal"),name_en:v("s_en"),name_km:v("s_km"),description_en:v("s_de"),description_km:v("s_dk"),price:Number(v("s_price")),cost:Number(v("s_cost")),stock:Number(v("s_stock")),reorder_point:Number(v("s_re")),sort:Number(v("s_sort")),active:v("s_act")==="1",image_url:v("s_img"),ingredients:ings.concat(del)};
  call("sets.save",{set}).then(()=>{toast("Saved");closeModal();refresh();}).catch(e=>toast(e.message,true));
}
function delSet(id){if(!confirm("Delete this set?"))return;call("sets.delete",{id}).then(()=>{toast("Deleted");refresh();}).catch(e=>toast(e.message,true));}
function uploadSet(inp,imgId){
  const f=inp.files[0];if(!f)return;
  const rd=new FileReader();
  rd.onload=async()=>{
    try{const d=await call("set.upload",{data_url:rd.result,file_name:f.name});document.getElementById(imgId).value=d.url;toast("Image uploaded");}catch(e){toast(e.message,true);}
  };
  rd.readAsDataURL(f);
}
function v(i){return document.getElementById(i).value.trim();}

function saveTw(){
  Promise.all([call("settings.set",{key:"twilio_sid",value:v("set_tw_sid")}),call("settings.set",{key:"twilio_token",value:v("set_tw_tok")}),call("settings.set",{key:"twilio_from",value:v("set_tw_from")})])
  .then(()=>toast("Twilio saved — test it below")).catch(e=>toast(e.message,true));
}
function testTwilio(){
  const to=v("tw_test_to").replace(/[^0-9]/g,"").replace(/^0+/,"855").replace(/^8550/,"855");
  if(!to)return toast("Enter a phone number",true);
  fetch(ACC,{method:"POST",headers:{"Content-Type":"application/json","apikey":SK,"Authorization":AUTHZ},body:JSON.stringify({action:"otp_send",phone:to})})
  .then(r=>r.json().catch(()=>({})).then(j=>r.ok?toast("SMS sent — check your phone (code in SMS)"):toast(j.error||("HTTP "+r.status),true)))
  .catch(e=>toast(e.message,true));
}
function savePg(){
  const a=v("set_pgsid"),b=v("set_pgauth");
  if(a&&b.length<8)return toast("Secret looks too short",true);
  Promise.all([call("settings.set",{key:"plasgate_key",value:a}),call("settings.set",{key:"plasgate_secret",value:b}),call("settings.set",{key:"plasgate_sender",value:v("set_pgsender")})]).then(()=>toast("Plasgate saved — phone OTP active")).catch(e=>toast(e.message,true));
}
function saveRate(){call("settings.set",{key:"usd_rate",value:v("set_rate")}).then(()=>toast("Rate saved")).catch(e=>toast(e.message,true));}
function savePw(){const p=v("set_pw");if(p.length<8)return toast("Too short",true);call("settings.set",{key:"store_admin_pass",value:p}).then(()=>{toast("Passcode updated");document.getElementById("set_pw").value="";}).catch(e=>toast(e.message,true));}

/* modal */
function modal(html){document.getElementById("modalRoot").innerHTML='<div class="modal" onclick="if(event.target===this)closeModal()"><div class="box">'+html+'</div></div>';}
function closeModal(){document.getElementById("modalRoot").innerHTML="";}
if(PASS){call("ping",{}).then(()=>enter()).catch(()=>{PASS="";localStorage.removeItem("sfm_admin_pass");});}
</script>
